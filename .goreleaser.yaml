# GoReleaser v2 config. Docs: https://goreleaser.com
# Local dry run:  goreleaser release --snapshot --clean
version: 2

project_name: unfurl

before:
  hooks:
    - go mod tidy

builds:
  - id: unfurl
    main: .
    binary: unfurl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: unfurl
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

# Homebrew tap. Requires:
#   1. A repo `vigneshakaviki/homebrew-tap` to exist.
#   2. A repo secret HOMEBREW_TAP_TOKEN (PAT with `contents:write` on that tap repo)
#      wired in .github/workflows/release.yml.
# Users then: `brew install vigneshakaviki/tap/unfurl`.
brews:
  - name: unfurl
    # Skip the formula push automatically when no tap token is configured, so a
    # release still publishes binaries. Set the secret to enable Homebrew.
    disable: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'
    repository:
      owner: vigneshakaviki
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/vigneshakaviki/unfurl"
    description: "See what your Helm chart actually deploys — render + footgun-lint any Helm/Kustomize/YAML."
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    test: |
      system "#{bin}/unfurl", "--version"
    install: |
      bin.install "unfurl"

release:
  github:
    owner: vigneshakaviki
    name: unfurl
  draft: false
  prerelease: auto
